<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استعادة التطبيق</title></head><body style="font-family:Arial,sans-serif;padding:24px;text-align:center"><h3>جاري استعادة نسخة التطبيق المستقرة…</h3><p id="s">يرجى الانتظار</p><script>
(async function(){
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));
    }
    if(window.caches){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.indexOf('employee-registry-')===0).map(k=>caches.delete(k)));}
  }catch(e){}
  document.getElementById('s').textContent='تم تنظيف كاش الواجهة، سيتم فتح التطبيق الآن';
  setTimeout(()=>location.replace('./?v=1536-recovery-'+Date.now()),700);
})();
</script></body></html>

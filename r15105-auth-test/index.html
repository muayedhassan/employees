 function post(type,other){
   if(!portalWindow||!portalOrigin)return;
   try{portalWindow.postMessage(Object.assign({hr105:'v1',nonce:nonce,type:type},other||{}),portalOrigin);}catch(_){ }
 }
 function openFrame(){
   if(!nonce)nonce=newNonce();
   portalWindow=null;portalOrigin='';
   frame.src=CFG.portal+'?embed=1&nonce='+encodeURIComponent(nonce);
 }
 function finishError(reason){
   clearTimeout(sessionTimeout);
   if(pending){pending.reject(new Error(reason));pending=null;}
 }
 function waitPortal(){
   return new Promise(function(resolve,reject){
     if(pending){reject(new Error('طلب دخول آخر قيد التنفيذ'));return;}
     pending={resolve:resolve,reject:reject};
     sessionTimeout=setTimeout(function(){finishError('تعذر التحقق من ربط الحركات داخل التطبيق. تأكد من نشر تحديث Portal الآمن واختبر التضمين أولًا.');},19000);
     openFrame();
   });
 }
 async function tokenToPortal(){
   if(!auth||!auth.currentUser)return;
   const idToken=await auth.currentUser.getIdToken();
   post('TOKEN',{idToken:idToken});
 }
 function showSession(){
   let pill=el('hr105-session');
   if(!pill){
     const controls=document.querySelector('#main-header .hdr-controls')||document.querySelector('#main-header');
     if(!controls)return;
     pill=document.createElement('button');pill.id='hr105-session';pill.type='button';
     pill.addEventListener('click',function(){if(window.confirm('تسجيل الخروج من نظام الموظفين؟'))logout();});
     controls.prepend(pill);
   }
   pill.innerHTML='<i class="fas fa-user-shield" aria-hidden="true"></i> '+roleName(role)+' <i class="fas fa-right-from-bracket" aria-hidden="true"></i>';
 }
 function enableApp(){
   verified=true;clearTimeout(sessionTimeout);error('');busy(false);
   shell.hidden=true;showSession();
   if(pending){pending.resolve();pending=null;}
 }
 async function logout(){
   verified=false;role='';
   notes.hidden=true;shell.hidden=false;
   const p=el('hr105-session');if(p)p.remove();
   post('SIGN_OUT');portalWindow=null;portalOrigin='';nonce='';
   frame.removeAttribute('src');
   try{if(auth)await auth.signOut();}catch(_){ }
   el('hr105-password').value='';busy(false);msg('تم تسجيل الخروج بأمان');
 }
 async function openNotes(){
   if(!verified){shell.hidden=false;error('سجّل الدخول إلى النظام أولًا');return;}
   notes.hidden=false;
   post('SHOW_NOTES');
 }
 function closeNotes(){notes.hidden=true;post('HIDE_NOTES');}
 window.addEventListener('message',async function(e){
   const d=e.data;
   if(!d||d.hr105!=='v1'||d.nonce!==nonce||!portalOriginOk(e.origin))return;
   if(!LIVE_HOST&&!LOCAL_TEST)return;
   if(d.type==='READY'){
     // The nested Apps Script HtmlService frame may be a child of an outer Google wrapper.
     // Reply to the actual sending frame, never to an unverified window or wildcard origin.
     portalWindow=e.source;portalOrigin=e.origin;
     try{await tokenToPortal();}catch(_){finishError('فشل الحصول على رمز جلسة Firebase');}
   }else if(d.type==='GET_TOKEN'){
     if(e.source!==portalWindow)return;
     try{await tokenToPortal();}catch(_){finishError('انتهت جلسة Firebase');}
   }else if(d.type==='AUTHORIZED'){
     if(e.source!==portalWindow||!auth||!auth.currentUser)return;
     if(d.role!=='SYSTEM_ADMIN'&&d.role!=='HR_MANAGER'){finishError('صلاحية الخادم غير معروفة');return;}
     role=d.role;enableApp();
   }else if(d.type==='REJECTED'){
     if(e.source!==portalWindow)return;
     finishError('رفض الخادم صلاحية هذا الحساب: '+String(d.reason||'AUTH_DENIED'));
   }else if(d.type==='SIGNED_OUT'||d.type==='REQUEST_SIGN_OUT'){
     if(e.source!==portalWindow)return;
     if(verified)logout();
   }
 });
 async function signIn(ev){
   ev.preventDefault();if(pending||sub.disabled)return;
   error('');msg('');busy(true);
   try{
     if(!auth)throw Error('مكتبة المصادقة غير متاحة؛ تحقق من اتصال الإنترنت');
     const email=el('hr105-email').value.trim(), password=el('hr105-password').value;
     if(!email||!password)throw Error('أدخل البريد الإلكتروني وكلمة المرور');
     if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw Error('صيغة البريد الإلكتروني غير صحيحة');
     if(!await authReady)throw Error('تعذر إعداد جلسة المصادقة');
     const cred=await auth.signInWithEmailAndPassword(email,password);
     el('hr105-password').value='';
     if(!cred.user||!cred.user.emailVerified)throw Error('يجب تأكيد البريد الإلكتروني أولًا');
     msg('تم التحقق من الحساب، يجري فحص صلاحيات الخادم…');
     await waitPortal(); // Fails closed; actual server WHOAMI required for all notes privileges.
   }catch(e){
     const k=String(e&&e.code||'');
     const map={'auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة','auth/invalid-email':'صيغة البريد الإلكتروني غير صحيحة',
       'auth/too-many-requests':'محاولات كثيرة؛ حاول لاحقًا','auth/network-request-failed':'تعذر الاتصال بخدمة المصادقة'};
     error(map[k]||String(e&&e.message||'تعذر تسجيل الدخول'));
     try{if(auth)await auth.signOut();}catch(_){ }
     frame.removeAttribute('src');nonce='';portalWindow=null;portalOrigin='';
     busy(false);msg('');
   }
 }
 form.addEventListener('submit',signIn);
 el('hr105-toggle').addEventListener('click',function(){
   const x=el('hr105-password'),visible=x.type==='password';x.type=visible?'text':'password';
   this.setAttribute('aria-pressed',String(visible));
   this.setAttribute('aria-label',visible?'إخفاء كلمة المرور':'إظهار كلمة المرور');
   this.classList.toggle('hr105-eye-revealed',visible);
 });
 el('hr105-notes-back').addEventListener('click',closeNotes);
 document.addEventListener('click',function(ev){
   const tab=ev.target&&ev.target.closest&&ev.target.closest('#stab-managernotes,[data-key="managernotes"]');
   if(!tab)return;
   ev.preventDefault();ev.stopImmediatePropagation();openNotes();
 },true);
 const previous=window.switchSub;
 if(typeof previous==='function')window.switchSub=function(n){
   if(n==='managernotes'){openNotes();return;}
   return previous.apply(this,arguments);
 };
 window.hrSecureNotesOpen=openNotes;
 window.hrSecureNotesClose=closeNotes;
 window.addEventListener('keydown',function(e){if(e.key==='Escape'&&!notes.hidden)closeNotes();});
 if(!LIVE_HOST&&!LOCAL_TEST){error('هذه النسخة التجريبية مخصصة فقط لنطاق التطبيق المعتمد');busy(false);sub.disabled=true;return;}
 if(CFG.apiKey.indexOf('__HR105_')===0){error('نسخة معاينة تصميم فقط — يجب ضبط Firebase Web API Key محليًا قبل اختبار الدخول');sub.disabled=true;return;}
 if(!window.firebase||!firebase.auth){error('تعذر تحميل مكتبات Firebase؛ تحقق من الإنترنت');sub.disabled=true;return;}
 try{
   firebase.initializeApp({apiKey:CFG.apiKey,authDomain:CFG.authDomain,projectId:CFG.projectId},'HRUnifiedR15105');
   auth=firebase.app('HRUnifiedR15105').auth();
   authReady=auth.setPersistence(firebase.auth.Auth.Persistence.NONE).then(function(){return true;},function(){return false;});
 }catch(_){error('تعذر تهيئة تسجيل الدخول الموحد');sub.disabled=true;}
})();

</script></body></html>

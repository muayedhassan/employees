<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سجل الموظفين">
<meta name="theme-color" content="#0a1628">
<title>سجل الموظفين الدائميين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --gold: #c9a84c;
  --gold2: #e8c96d;
  --navy: #0a1628;
  --blue1: #0d1b3e;
  --blue2: #112244;
  --blue3: #1a3260;
  --blue4: #1e3a6a;
  --blue5: #2a4a7f;
  --text: #d8eaff;
  --text2: #8ab4d8;
  --accent: #5bc2ff;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; overflow: hidden;
  font-family: 'Cairo', Tahoma, Arial, sans-serif;
  background: var(--navy);
  direction: rtl;
  -webkit-font-smoothing: antialiased;
}

/* ===== LAYOUT: FIXED HEADER + SCROLLABLE BODY ===== */
.app {
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh;
  overflow: hidden;
}

/* ===== HEADER ===== */
.header {
  flex-shrink: 0;
  background: linear-gradient(135deg, #060f20 0%, #0d1f45 50%, #1a3a6b 100%);
  padding: calc(var(--safe-top) + 14px) 16px 12px;
  border-bottom: 2px solid var(--gold);
  position: relative;
  overflow: hidden;
}
.header::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), var(--gold2), var(--gold), transparent);
  animation: shimmer 3s ease-in-out infinite;
}
@keyframes shimmer { 0%,100%{opacity:.5} 50%{opacity:1} }

.header-row {
  display: flex; align-items: center; gap: 12px;
}
.app-icon {
  width: 46px; height: 46px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; color: var(--navy);
  box-shadow: 0 4px 15px rgba(201,168,76,0.5);
  animation: pulse-icon 3s ease-in-out infinite;
}
@keyframes pulse-icon {
  0%,100%{ box-shadow: 0 4px 15px rgba(201,168,76,0.4); }
  50%{ box-shadow: 0 4px 25px rgba(201,168,76,0.8); }
}
.header-text { flex: 1; min-width: 0; }
.ministry-name {
  font-size: 10px; color: var(--gold); font-weight: 600;
  letter-spacing: 1px; margin-bottom: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.dept-name {
  font-size: 12px; color: var(--text2); margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.doc-title {
  font-size: 17px; color: #fff; font-weight: 900; line-height: 1.2;
}

/* ===== STATS ROW ===== */
.stats {
  flex-shrink: 0;
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: #080f20;
  border-bottom: 1px solid var(--blue4);
}
.stat {
  padding: 10px 6px; text-align: center;
  border-left: 1px solid var(--blue4);
  position: relative;
}
.stat:last-child { border-left: none; }
.stat-icon {
  font-size: 13px; color: var(--gold); margin-bottom: 3px;
}
.stat-val {
  font-family: 'Oswald', sans-serif;
  font-size: 20px; font-weight: 700; color: var(--gold);
  letter-spacing: 1px; line-height: 1;
}
.stat-lbl { font-size: 10px; color: var(--text2); margin-top: 2px; }

/* ===== SEARCH BAR ===== */
.search-bar {
  flex-shrink: 0;
  background: var(--blue2);
  padding: 10px 12px;
  display: flex; gap: 8px; align-items: center;
  border-bottom: 1px solid var(--blue4);
}
.search-wrap {
  flex: 1; position: relative;
}
.search-wrap i {
  position: absolute; right: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--gold); font-size: 13px; pointer-events: none;
}
.search-wrap input {
  width: 100%; padding: 10px 36px 10px 12px;
  border-radius: 10px; border: 1px solid var(--blue5);
  background: var(--blue3); color: var(--text);
  font-size: 15px; font-family: 'Cairo', sans-serif;
  outline: none; direction: rtl;
  -webkit-appearance: none;
  transition: border-color 0.2s;
}
.search-wrap input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 2px rgba(201,168,76,0.2);
}
.search-wrap input::placeholder { color: #4a6a9a; }
.pp-select {
  padding: 10px 8px; border-radius: 10px;
  border: 1px solid var(--blue5); background: var(--blue3);
  color: var(--text); font-size: 12px;
  font-family: 'Cairo', sans-serif; outline: none;
  -webkit-appearance: none; cursor: pointer;
  white-space: nowrap;
}

/* ===== SCROLL AREA ===== */
.scroll-area {
  flex: 1; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}

/* ===== CARDS (MOBILE-FIRST) ===== */
.card-list { padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.emp-card {
  background: linear-gradient(135deg, var(--blue2), var(--blue3));
  border: 1px solid rgba(42,74,127,0.6);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex; align-items: center; gap: 12px;
  transition: all 0.2s;
  animation: slideIn 0.3s ease both;
  position: relative; overflow: hidden;
}
.emp-card::before {
  content: ''; position: absolute;
  top: 0; right: 0; width: 3px; height: 100%;
  background: linear-gradient(180deg, var(--gold), transparent);
  opacity: 0; transition: opacity 0.2s;
}
.emp-card:active { background: var(--blue4); transform: scale(0.98); }
.emp-card:active::before { opacity: 1; }
@keyframes slideIn {
  from { opacity:0; transform: translateY(8px); }
  to { opacity:1; transform: translateY(0); }
}
.card-serial {
  width: 34px; height: 34px; flex-shrink: 0;
  background: rgba(201,168,76,0.1);
  border: 1px solid rgba(201,168,76,0.3);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Oswald', sans-serif;
  font-size: 13px; font-weight: 700; color: var(--gold);
}
.card-info { flex: 1; min-width: 0; }
.card-name {
  font-size: 14px; font-weight: 700; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 3px;
}
.card-sub {
  font-size: 11px; color: var(--text2);
  display: flex; align-items: center; gap: 4px;
}
.card-sub i { font-size: 9px; color: var(--gold); }
.card-id {
  flex-shrink: 0;
  background: rgba(91,194,255,0.08);
  border: 1px solid rgba(91,194,255,0.25);
  border-radius: 10px;
  padding: 6px 10px;
  text-align: center;
}
.card-id-num {
  font-family: 'Oswald', sans-serif;
  font-size: 18px; font-weight: 700; color: var(--accent);
  letter-spacing: 2px; line-height: 1;
}
.card-id-lbl {
  font-size: 9px; color: #4a7aaa; margin-top: 1px;
}

/* ===== NO RESULTS ===== */
.no-res {
  display: none; flex-direction: column; align-items: center;
  justify-content: center; padding: 60px 20px; gap: 12px;
  color: var(--text2); text-align: center;
}
.no-res i { font-size: 48px; color: var(--blue5); }
.no-res p { font-size: 16px; }

/* ===== PAGINATION ===== */
.pg-wrap {
  flex-shrink: 0;
  display: flex; gap: 5px; align-items: center;
  justify-content: center; flex-wrap: wrap;
  padding: 10px 12px calc(var(--safe-bottom) + 10px);
  background: var(--navy);
  border-top: 1px solid var(--blue4);
}
.pg-btn {
  font-family: 'Cairo', sans-serif;
  background: var(--blue3); color: var(--text2);
  border: 1px solid var(--blue5); border-radius: 8px;
  padding: 8px 13px; font-size: 13px; cursor: pointer;
  transition: all 0.15s; min-width: 40px; text-align: center;
  -webkit-tap-highlight-color: transparent;
}
.pg-btn:active { transform: scale(0.94); }
.pg-btn.active {
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  color: var(--navy); border-color: var(--gold); font-weight: 700;
  box-shadow: 0 3px 10px rgba(201,168,76,0.4);
}
.pg-info {
  font-size: 11px; color: #4a6a9a;
  padding: 0 4px; white-space: nowrap;
}

/* ===== PARTICLES ===== */
#ptc { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden; }
.pt { position:absolute; border-radius:50%; background:rgba(201,168,76,0.12); animation:flt linear infinite; }
@keyframes flt { 0%{transform:translateY(100vh) rotate(0);opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{transform:translateY(-80px) rotate(360deg);opacity:0} }
</style>
</head>
<body>
<div id="ptc"></div>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-row">
      <div class="app-icon"><i class="fas fa-seedling"></i></div>
      <div class="header-text">
        <div class="ministry-name"><i class="fas fa-star" style="font-size:8px"></i> وزارة الزراعة</div>
        <div class="dept-name">مديرية زراعة صلاح الدين</div>
        <div class="doc-title">سجل الموظفين الدائميين</div>
      </div>
      <div style="text-align:center;flex-shrink:0">
        <div style="font-family:Oswald,sans-serif;font-size:22px;font-weight:700;color:var(--gold)">854</div>
        <div style="font-size:10px;color:var(--text2)">موظف</div>
      </div>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat">
      <div class="stat-icon"><i class="fas fa-users"></i></div>

    <div class="stat">

      <div class="stat-val" id="shown">854</div>

    <div class="stat">

      <div class="stat-val" id="pgnum">1/1</div>

    </div>
  </div>

  <!-- SEARCH -->
  <div class="search-bar">
    <div class="search-wrap">
      <i class="fas fa-search"></i>
      <input type="text" id="q" placeholder="ابحث بالاسم أو رقم الاضبارة..." oninput="doFilter()" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <select class="pp-select" id="pp" onchange="doFilter()">
      <option value="30">30</option>
      <option value="50" selected>50</option>
      <option value="100">100</option>
      <option value="99999">الكل</option>
    </select>
  </div>

  <!-- SCROLL AREA -->
  <div class="scroll-area" id="scroll">
    <div class="card-list" id="cards"></div>
    <div class="no-res" id="nores">
      <i class="fas fa-search-minus"></i>
      <p>لا توجد نتائج مطابقة</p>
    </div>
  </div>

  <!-- PAGINATION -->
  <div class="pg-wrap" id="pg"></div>

</div>

<script>

(function(){
  const c=document.getElementById('ptc');
  for(let i=0;i<12;i++){
    const p=document.createElement('div');
    p.className='pt';
    const s=Math.random()*6+3;
    p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${Math.random()*18+12}s;animation-delay:${Math.random()*12}s;opacity:${Math.random()*0.3+0.1}`;
    c.appendChild(p);
  }
})();

let filt=ALL, pg=1;

function pp(){ return parseInt(document.getElementById('pp').value); }

function doFilter(){
  const q=document.getElementById('q').value.trim();
  filt=q?ALL.filter(e=>e.name.includes(q)||String(e.num).includes(q)):ALL;
  document.getElementById('shown').textContent=filt.length;
  pg=1; render();
}

function render(){
  const p=pp(), tot=filt.length, pages=Math.max(1,Math.ceil(tot/p));

    const idx=s+i+1;

function buildPg(pages){
  const el=document.getElementById('pg');
  if(pages<=1){el.innerHTML='';return;}
  let h='';
  if(pg>1) h+=`<button class="pg-btn" onclick="go(1)"><i class="fas fa-angle-double-right"></i></button>

}
